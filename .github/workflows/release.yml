name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libgtk-3-dev \
            libappindicator3-dev \
            libsecret-1-dev \
            pkg-config \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install AppImage tools
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p "$HOME/.local/bin"
          wget -O "$HOME/.local/bin/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -O "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run secret scan
        run: ./scripts/check-no-secrets.sh

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./packaging/appimage/build-appimage.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/appimage/out/Flow_Linux-x86_64.AppImage
            packaging/appimage/out/sha256sums.txt
