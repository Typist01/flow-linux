[package]
name = "flow-spike-hotkey"
version = "0.0.1"
edition = "2021"

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "tokio"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
