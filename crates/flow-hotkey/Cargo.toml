[package]
name = "flow-hotkey"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "tokio"] }
flow-config = { path = "../flow-config" }
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
tracing = "0.1"
