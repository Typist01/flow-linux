[package]
name = "flow-ui"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
crossbeam-channel = "0.5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flow-settings = { path = "../flow-settings" }
image = { version = "0.25", default-features = false, features = ["png"] }
muda = { version = "0.19", default-features = false, features = ["gtk"] }
notify-rust = "4"
tracing = "0.1"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
winit = { version = "0.30", default-features = false, features = ["wayland", "x11", "rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
